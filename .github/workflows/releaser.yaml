name: goreleaser

on:
  push:
    # run only against tags
    tags:
      - '*'

permissions:
  contents: write
  # packages: write
  issues: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch all tags
        run: git fetch --force --tags
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        id: goreleaser
        continue-on-error: true
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUR_PRIVATE_KEY: ${{ secrets.AUR_PRIVATE_KEY }}
      - name: Verify release created
        if: steps.goreleaser.outcome == 'failure'
        run: |
          if gh release view "${{ github.ref_name }}" &>/dev/null; then
            echo "::warning::GoReleaser reported failure (likely AUR push) but release was created successfully"
          else
            echo "::error::Release was not created"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          ./hack/generate-release-notes.sh

  image:
    name: Publish the container image
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml

  helm-chart:
    name: Publish the Helm chart
    runs-on: ubuntu-latest
    needs: [goreleaser, image]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Package and push the chart to ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The chart is versioned with the gosmee release it ships with, and
          # its appVersion is the image tag published by the image job above, so
          # `helm install --version` pins both the chart and the binary.
          version="${GITHUB_REF_NAME#v}"
          helm package charts/gosmee \
            --version "${version}" --app-version "${version}" --destination dist
          echo "${GH_TOKEN}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin
          helm push "dist/gosmee-${version}.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}/charts"
