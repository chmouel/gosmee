name: Build and Test
on: ["push", "pull_request"]
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "^1.20.0"

      - uses: alexellis/setup-arkade@v3
      - uses: alexellis/arkade-get@master
        with:
          golangci-lint: latest
      - name: Lint Go Code
        run: |
          make lint-go

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, e2e]
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "^1.20.0"

      - name: Build
        run: |
          make build

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "^1.20.0"

      - name: Run Unit tests.
        run: |
          make test

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "^1.20.0"

      - name: Run Redis E2E tests.
        env:
          GOSMEE_REDIS_TEST_URL: redis://localhost:6379/0
        run: |
          make test-e2e
